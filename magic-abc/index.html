    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-1: #a8d8ea; --bg-2: #ffdab9;
            --yellow: #FFD166; --orange: #FFB347; --green: #06D6A0;
            --turquoise: #118AB2; --pink: #EF476F;
            --trazado-bg: #FFFEF9; --text: #2D3436; --text-light: #636e72;
        }
        body {
            font-family: 'Baloo 2', cursive, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; touch-action: none;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .app {
            width: 100%; max-width: 480px; height: 100vh; height: 100dvh;
            max-height: 900px; background: #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; position: relative;
        }
        @media (min-width: 480px) { .app { border-radius: 24px; height: 92vh; height: 92dvh; } }

        header {
            display: flex; justify-content: space-between; align-items: center;

        .dropdown-content {

        .btn {

            cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;

            cursor: pointer; font-family: 'Baloo 2', cursive;

        .debug-lvl-btn.minus { background: #fef3c7; border-color: #f59e0b; color: #92400e; }

<script>
// ==========================================
//  MAGICABC — Juego de Trazado de Letras
//  Agent 15 — Gameplay Engineer
// ==========================================

const GAME_ID = 'magicabc';
</script>
<script src="letter-paths.js"></script>
<script>
// ==========================================
//  LEVELS
// ==========================================
const LEVELS = [
    { level:1, type:'letters', items:'ABCDEFG'.split(''), guideAuto:true, guideDelay:1500 },
    { level:2, type:'letters', items:'HIJKLMNÑOPQRSTUVWXYZ'.split(''), guideAuto:true, guideDelay:1200 },
    { level:3, type:'letters', items:'abcdefghijklmnñopqrstuvwxyz'.split(''), guideAuto:true, guideDelay:1200 },
    { level:4, type:'words', items:[
        {word:'Sol',emoji:'☀️'},{word:'Luz',emoji:'💡'},{word:'Pan',emoji:'🍞'},{word:'Mar',emoji:'🌊'},{word:'Pez',emoji:'🐟'},{word:'Oso',emoji:'🐻'},{word:'Gato',emoji:'🐱'},{word:'Casa',emoji:'🏠'},{word:'Mano',emoji:'✋'},{word:'Boca',emoji:'👄'}
    ], guideAuto:true, guideDelay:1000 },
    { level:5, type:'words', items:[
        {word:'Mamá',emoji:'👩'},{word:'Papá',emoji:'👨'},{word:'Niño',emoji:'👦'},{word:'Niña',emoji:'👧'},{word:'Bebé',emoji:'👶'},{word:'Abrazo',emoji:'🤗'},{word:'Besito',emoji:'😘'},{word:'Amigo',emoji:'👫'},{word:'Feliz',emoji:'😊'},{word:'Grande',emoji:'🌟'}
    ], guideAuto:false, guideDelay:1000 },
    { level:6, type:'words', items:[
        {word:'Nube',emoji:'☁️'},{word:'Flor',emoji:'🌸'},{word:'Árbol',emoji:'🌳'},{word:'Lluvia',emoji:'🌧️'},{word:'Estrella',emoji:'⭐'},{word:'Planeta',emoji:'🪐'},{word:'Montaña',emoji:'⛰️'},{word:'Jardín',emoji:'🌺'},{word:'Río',emoji:'🏞️'},{word:'Playa',emoji:'🏖️'}
    ], guideAuto:false, guideDelay:1000 },
    { level:7, type:'words', items:[
        {word:'Colegio',emoji:'🏫'},{word:'Maestra',emoji:'👩‍🏫'},{word:'Pintura',emoji:'🎨'},{word:'Música',emoji:'🎵'},{word:'Cuento',emoji:'📖'},{word:'Lápiz',emoji:'✏️'},{word:'Libro',emoji:'📚'},{word:'Número',emoji:'🔢'},{word:'Letra',emoji:'🔤'},{word:'Juego',emoji:'🎮'}
    ], guideAuto:false, guideDelay:1000 }
];

// ==========================================
//  GAME STATE
// ==========================================
const saved = UserSystem.getProgress(GAME_ID);
let state = {
    level: saved.level || 1,
    coins: saved.coins || 0,
    completedLetters: saved.completedLetters || [],
    achievements: saved.achievements || [],
    failedAttempts: 0,
    currentItemIndex: saved.currentItemIndex || 0,
    wordLetterIndex: saved.wordLetterIndex || 0,
};

let traceState = {
    isDrawing: false,
    pathProgress: 0,
    guideActive: false,
    guideAnimId: null,
    userPoints: [],
    segmentsCovered: new Set(),
    totalSegments: 0,
    reconnectTimer: null,
    lastPoint: null,
};

// ==========================================
//  CANVAS SETUP
// ==========================================
const canvas = document.getElementById('trace-canvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');
let dpr = window.devicePixelRatio || 1;

function resizeCanvas() {
    const w = wrapper.clientWidth;
    const h = wrapper.clientHeight;
    if (w === 0 || h === 0) return;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); calculateRenderPath(); renderPath(); });
// iOS Safari: recalcular al cambiar orientación
window.addEventListener('orientationchange', () => {
    setTimeout(() => { resizeCanvas(); calculateRenderPath(); renderPath(); }, 200);
});

// ==========================================
//  PATH CALCULATION
// ==========================================
function getCurrentItem() {
    const lvl = LEVELS[state.level - 1];
    const items = lvl.items;
    const idx = state.currentItemIndex % items.length;
    return items[idx];
}

function getItemType() {
    return LEVELS[state.level - 1].type;
}

function getLetterPaths(letter) {
    return LETTER_PATHS[letter] || LETTER_PATHS[letter.toUpperCase()] || LETTER_PATHS['I'];
}

function getCanvasPath(letterPath, scaleX, scaleY, offsetX, offsetY) {
    return letterPath.map(p => ({
        x: p.x * scaleX + offsetX,
        y: p.y * scaleY + offsetY
    }));
}

// Calculate path segments for validation
function getPathSegments(path) {
    const segments = [];
    for (let i = 1; i < path.length; i++) {
        segments.push({ a: path[i-1], b: path[i] });
    }
    return segments;
}

function distPointToSegment(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const lenSq = dx*dx + dy*dy;
    if (lenSq === 0) return Math.hypot(px - ax, py - ay);
    let t = ((px - ax) * dx + (py - ay) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + t*dx), py - (ay + t*dy));
}

// ==========================================
//  RENDER
// ==========================================
let currentPath = [];
let wordLetterPaths = []; // For words: array of {path, x, y, width}

function calculateRenderPath() {
    const w = wrapper.clientWidth, h = wrapper.clientHeight;
    if (w === 0 || h === 0) return;
    const item = getCurrentItem();
    const type = getItemType();
    const LETTER_W = 200, LETTER_H = 250;

    if (type === 'letters') {
        const scale = Math.min(w / LETTER_W, h / LETTER_H) * 0.78;
        const path = getLetterPaths(item);
        const ox = (w - LETTER_W * scale) / 2;
        const oy = (h - LETTER_H * scale) / 2;
        currentPath = getCanvasPath(path, scale, scale, ox, oy);
        wordLetterPaths = [];
    } else {
        // Word: trazar UNA letra a la vez, sin ligaduras
        const word = item.word;
        const letterCount = word.length;
        const totalWidth = Math.min(w * 0.88, letterCount * 90);
        const letterW = totalWidth / letterCount;
        const scale = letterW / LETTER_W * 0.8;
        const startX = (w - totalWidth) / 2;
        
        // Mostrar todas las letras como referencia tenue
        wordLetterPaths = [];
        for (let i = 0; i < word.length; i++) {
            const ch = word[i];
            const letterKey = i === 0 ? ch.toUpperCase() : ch.toLowerCase();
            const lp = getLetterPaths(letterKey);
            const ox = startX + i * letterW;
            const oy = (h - LETTER_H * scale) / 2;
            const cp = getCanvasPath(lp, scale, scale, ox, oy);
            wordLetterPaths.push({ letter: ch, path: cp, x: ox, y: oy, w: letterW, h: LETTER_H * scale, completed: i < state.wordLetterIndex });
        }
        
        // Solo la letra actual tiene el path activo para trazar
        const idx = Math.min(state.wordLetterIndex, wordLetterPaths.length - 1);
        currentPath = wordLetterPaths[idx].path;
    }
}

function renderPath() {
    const w = wrapper.clientWidth, h = wrapper.clientHeight;
    if (w === 0 || h === 0) return;
    ctx.clearRect(0, 0, w, h);

    // Draw dotted path
    if (currentPath.length < 2) return;
    ctx.setLineDash([8, 10]);
    ctx.strokeStyle = '#d1d5db';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(currentPath[0].x, currentPath[0].y);
    for (let i = 1; i < currentPath.length; i++) {
        ctx.lineTo(currentPath[i].x, currentPath[i].y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw user trace — SIEMPRE visible hasta validación
    if (traceState.userPoints.length > 1) {
        // Más grueso al reconectar (morado) para mostrar que se puede continuar
        const isReconnecting = !traceState.isDrawing && traceState.userPoints.length > 0;
        ctx.strokeStyle = isReconnecting ? '#c026d3' : '#EF476F';
        ctx.lineWidth = isReconnecting ? 7 : 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = isReconnecting ? 'rgba(192,38,211,0.6)' : 'rgba(239,71,111,0.6)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(traceState.userPoints[0].x, traceState.userPoints[0].y);
        for (let i = 1; i < traceState.userPoints.length; i++) {
            ctx.lineTo(traceState.userPoints[i].x, traceState.userPoints[i].y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    // Draw guide ball
    if (traceState.guideActive && currentPath.length > 0) {
        const t = (Date.now() % 3000) / 3000;
        const idx = Math.floor(t * (currentPath.length - 1));
        const p = currentPath[Math.min(idx, currentPath.length - 1)];
        ctx.fillStyle = '#FFD166';
        ctx.shadowColor = 'rgba(255,209,102,0.7)';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 10, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Draw word letter labels and completed letters
    if (wordLetterPaths.length > 0) {
        wordLetterPaths.forEach((wl, i) => {
            ctx.setLineDash([4, 6]);
            ctx.strokeStyle = i < state.wordLetterIndex ? '#d1fae5' : // completada: verde claro
                              i === state.wordLetterIndex ? '#d1d5db' : '#f3f4f6'; // actual / futura
            ctx.lineWidth = i === state.wordLetterIndex ? 6 : 4;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.beginPath();
            const p = wl.path;
            ctx.moveTo(p[0].x, p[0].y);
            for (let k = 1; k < p.length; k++) ctx.lineTo(p[k].x, p[k].y);
            ctx.stroke();
            ctx.setLineDash([]);
        });
    }
}

function updateProgressBar() {
    const bar = document.getElementById('progress-bar');
    bar.style.width = Math.round(traceState.pathProgress) + '%';
}

// ==========================================
//  VALIDATION
// ==========================================
function validateTrace() {
    if (currentPath.length < 2) return 0;
    
    const segments = getPathSegments(currentPath);
    traceState.totalSegments = segments.length;
    traceState.segmentsCovered = new Set();
    
    const THRESHOLD = 16; // distancia en px para considerar segmento cubierto
    
    for (let si = 0; si < segments.length; si++) {
        const seg = segments[si];
        for (const up of traceState.userPoints) {
            const d = distPointToSegment(up.x, up.y, seg.a.x, seg.a.y, seg.b.x, seg.b.y);
            if (d < THRESHOLD) {
                traceState.segmentsCovered.add(si);
                break;
            }
        }
    }
    
    const coverage = traceState.segmentsCovered.size / Math.max(segments.length, 1);
    return coverage;
}

function calculateRealTimeProgress(mx, my) {
    if (currentPath.length < 2) return traceState.pathProgress;
    
    const segments = getPathSegments(currentPath);
    for (let si = 0; si < segments.length; si++) {
        const seg = segments[si];
        const d = distPointToSegment(mx, my, seg.a.x, seg.a.y, seg.b.x, seg.b.y);
        if (d < 16) {
            traceState.segmentsCovered.add(si);
        }
    }
    
    const cov = traceState.segmentsCovered.size / Math.max(segments.length, 1);
    return Math.min(cov, 1) * 100;
}

// ==========================================
//  AUDIO (Web Audio API)
// ==========================================
const AudioFX = (() => {
    let ctx = null;
    function getCtx() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        return ctx;
    }
    function tone(freq, dur, type='sine', vol=0.2, delay=0) {
        try {
            const c = getCtx();
            const o = c.createOscillator();
            const g = c.createGain();
            o.connect(g); g.connect(c.destination);
            o.type = type;
            o.frequency.setValueAtTime(freq, c.currentTime + delay);
            g.gain.setValueAtTime(0, c.currentTime + delay);
            g.gain.linearRampToValueAtTime(vol, c.currentTime + delay + 0.01);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + delay + dur);
            o.start(c.currentTime + delay);
            o.stop(c.currentTime + delay + dur);
        } catch(e) {}
    }
    return {
        guia() { tone(600, 0.05, 'sine', 0.1); },
        trazoExito() { tone(523,0.1,'sine',0.2,0); tone(659,0.1,'sine',0.2,0.1); tone(784,0.15,'sine',0.25,0.2); },
        trazoReintento() { tone(400,0.08,'sine',0.15,0); tone(300,0.12,'sine',0.15,0.08); },
        moneda() { tone(1200,0.08,'triangle',0.25); },
        logro() { tone(523,0.1,'square',0.2,0); tone(659,0.1,'square',0.2,0.12); tone(784,0.1,'square',0.2,0.24); tone(1047,0.2,'square',0.25,0.36); },
        nivelCompleto() {
            [523,659,784,1047].forEach((f,i) => tone(f,0.2,'square',0.2,i*0.12));
            setTimeout(() => { tone(523,0.4,'sine',0.15); tone(659,0.4,'sine',0.15); tone(784,0.4,'sine',0.15); }, 600);
        },
        confetiPop() { tone(900,0.03,'sine',0.08); }
    };
})();

// ==========================================
//  PARTICLES (Stars + Confetti)
// ==========================================
let particles = [];
function spawnStars(x, y, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.8)*4 - 1,
            life: 1, decay: 0.015 + Math.random()*0.025, size: 3 + Math.random()*6,
            emoji: '✨', type: 'star'
        });
    }
}
function spawnTraceParticle(x, y) {
    const colors = ['#FFD166','#EF476F','#118AB2','#06D6A0','#FFB347'];
    // 2-3 destellos por punto de trazo
    const count = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x + (Math.random()-0.5)*8, y: y + (Math.random()-0.5)*8,
            vx: (Math.random()-0.5)*2.5, vy: (Math.random()-1.5)*2 - 1,
            life: 1, decay: 0.025 + Math.random()*0.035,
            size: 4 + Math.random()*6,
            color: colors[Math.floor(Math.random()*colors.length)],
            type: 'trace'
        });
    }
    // También un emoji estrella ocasional
    if (Math.random() < 0.3) {
        particles.push({
            x: x + (Math.random()-0.5)*10, y: y + (Math.random()-0.5)*10,
            vx: (Math.random()-0.5)*1, vy: -1.5 - Math.random()*1.5,
            life: 1, decay: 0.02 + Math.random()*0.03,
            size: 6 + Math.random()*5,
            emoji: '✨', type: 'star'
        });
    }
}
function spawnConfetti(count) {
    const w = wrapper.clientWidth;
    for (let i = 0; i < count; i++) {
        particles.push({
            x: Math.random() * w, y: -10,
            vx: (Math.random()-0.5)*3, vy: 1.5 + Math.random()*3,
            life: 1, decay: 0.008 + Math.random()*0.012, size: 8 + Math.random()*10,
            color: ['#FFD166','#EF476F','#06D6A0','#118AB2','#FFB347'][Math.floor(Math.random()*5)],
            type: 'confetti'
        });
    }
}

function updateParticles() {
    const w = wrapper.clientWidth;
    const h = wrapper.clientHeight;
    particles = particles.filter(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.type === 'confetti') { p.vx += (Math.random()-0.5)*0.3; p.vy += 0.05; }
        p.life -= p.decay;
        // Eliminar partículas fuera del canvas o sin vida
        return p.life > 0 && p.x > -20 && p.x < w + 20 && p.y > -20 && p.y < h + 20;
    });
}

function renderParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        if (p.type === 'star') {
            ctx.font = `${p.size*3}px serif`;
            ctx.fillText('✨', p.x - p.size*1.5, p.y + p.size);
        } else if (p.type === 'trace') {
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        } else {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size*0.6, p.size);
        }
    });
    ctx.globalAlpha = 1;
}

// ==========================================
//  TOUCH / MOUSE HANDLERS
// ==========================================
function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const scaleX = canvas.width / dpr / (rect.width || 1);
    const scaleY = canvas.height / dpr / (rect.height || 1);
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

function handleStart(e) {
    e.preventDefault();
    
    // Cancelar cualquier validación pendiente (ventana de reconexión)
    if (traceState.reconnectTimer) {
        clearTimeout(traceState.reconnectTimer);
        traceState.reconnectTimer = null;
    }
    
    stopGuide();
    const pos = getPos(e);
    
    // Si hay puntos previos y el nuevo toque está cerca → RECONECTAR
    if (traceState.userPoints.length > 0 && traceState.lastPoint) {
        const dx = pos.x - traceState.lastPoint.x;
        const dy = pos.y - traceState.lastPoint.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 80) {
            // Reconexión exitosa: continuar el trazo
            traceState.isDrawing = true;
            traceState.userPoints.push(pos);
            wrapper.classList.add('active');
            document.getElementById('guide-label').textContent = '¡Sigue el camino punteado!';
            return;
        }
    }
    
    // Nuevo trazo desde cero
    traceState.isDrawing = true;
    traceState.userPoints = [];
    traceState.segmentsCovered = new Set();
    traceState.lastPoint = null;
    wrapper.classList.add('active');
    traceState.userPoints.push(pos);
}

function handleMove(e) {
    e.preventDefault();
    if (!traceState.isDrawing) return;
    const pos = getPos(e);
    traceState.userPoints.push(pos);
    traceState.lastPoint = pos;
    traceState.pathProgress = calculateRealTimeProgress(pos.x, pos.y);
    updateProgressBar();
    // Destellos mágicos siguiendo el dedo ✨🩷🟡🔵🟢🟠
    spawnTraceParticle(pos.x, pos.y);
}

function handleEnd(e) {
    e.preventDefault();
    if (!traceState.isDrawing) return;
    traceState.isDrawing = false;
    wrapper.classList.remove('active');
    
    // Mostrar mensaje de reconexión
    const prevLabel = document.getElementById('guide-label').textContent;
    document.getElementById('guide-label').textContent = '👆 ¡Sigue trazando! Tienes 3 segundos...';
    
    // Ventana de reconexión: esperar 3s antes de validar
    traceState.reconnectTimer = setTimeout(() => {
        traceState.reconnectTimer = null;
        document.getElementById('guide-label').textContent = prevLabel;
        
        // Validar que el niño haya hecho al menos 8 puntos de trazo
        if (traceState.userPoints.length < 8) {
            onTraceFail();
            return;
        }
        
        const coverage = validateTrace();
        traceState.pathProgress = coverage * 100;
        updateProgressBar();
        
        if (coverage >= 0.75) {
            onTraceSuccess();
        } else {
            onTraceFail();
        }
    }, 3000);
}

canvas.addEventListener('touchstart', handleStart, {passive:false});
canvas.addEventListener('touchmove', handleMove, {passive:false});
canvas.addEventListener('touchend', handleEnd, {passive:false});
canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('mousemove', (e) => { if (traceState.isDrawing) handleMove(e); });
canvas.addEventListener('mouseup', handleEnd);
canvas.addEventListener('mouseleave', handleEnd);

// ==========================================
//  GUIDE BALL
// ==========================================
function startGuide() {
    const lvl = LEVELS[state.level - 1];
    const shouldAuto = lvl.guideAuto;
    if (!shouldAuto) return;
    
    traceState.guideActive = true;
    setTimeout(() => {
        if (traceState.isDrawing) return; // user already drawing
        traceState.guideAnimId = setInterval(() => {
            renderPath();
        }, 50);
    }, lvl.guideDelay);
}

function stopGuide() {
    traceState.guideActive = false;
    if (traceState.guideAnimId) {
        clearInterval(traceState.guideAnimId);
        traceState.guideAnimId = null;
    }
}

function showManualGuide() {
    if (traceState.isDrawing || traceState.userPoints.length > 0) return;
    traceState.guideActive = true;
    traceState.guideAnimId = setInterval(() => {
        renderPath();
    }, 50);
    setTimeout(() => stopGuide(), 2500);
}

// ==========================================
//  GAME LOGIC
// ==========================================
function onTraceSuccess() {
    wrapper.classList.add('success');
    setTimeout(() => wrapper.classList.remove('success'), 600);
    AudioFX.trazoExito();
    spawnStars(canvas.width/2, canvas.height/2, 15);
    spawnConfetti(20);
    
    state.coins += 5;
    state.failedAttempts = 0;
    
    const type = getItemType();
    const item = getCurrentItem();
    
    if (type === 'words') {
        // Palabra: avanzar a la siguiente letra
        state.wordLetterIndex++;
        const wordLen = item.word.length;
        if (state.wordLetterIndex >= wordLen) {
            // ¡Palabra completa!
            const itemKey = item.word;
            if (!state.completedLetters.includes(itemKey)) {
                state.completedLetters.push(itemKey);
            }
            checkAchievements();
            saveProgress();
            updateHUD();
            document.getElementById('success-emoji').textContent = item.emoji;
            document.getElementById('success-desc').textContent = `¡Palabra "${item.word}" completada!`;
            document.getElementById('overlay-success').classList.add('show');
        } else {
            // Siguiente letra de la palabra
            saveProgress();
            updateHUD();
            resetItem();
        }
    } else {
        // Letra individual
        const itemKey = item;
        if (!state.completedLetters.includes(itemKey)) {
            state.completedLetters.push(itemKey);
        }
        checkAchievements();
        saveProgress();
        updateHUD();
        document.getElementById('success-emoji').textContent = item;
        document.getElementById('success-desc').textContent = `¡Letra ${item} completada!`;
        document.getElementById('overlay-success').classList.add('show');
    }
}

function onTraceFail() {
    AudioFX.trazoReintento();
    
    // Dejar el trazo visible 1 segundo para que el niño vea lo que dibujó
    // Luego se desvanece y se limpia
    setTimeout(() => {
        traceState.userPoints = [];
        traceState.segmentsCovered = new Set();
        traceState.pathProgress = 0;
        updateProgressBar();
        renderPath();
    }, 1000);
    
    state.failedAttempts++;
    saveProgress();
    
    // Degradation check
    if (state.level > 1 && state.failedAttempts >= 15) {
        state.level--;
        state.failedAttempts = 0;
        state.currentItemIndex = 0;
        state.wordLetterIndex = 0;
        state.completedLetters = [];
        saveProgress();
        document.getElementById('guide-label').textContent = '😅 Bajamos un nivel. ¡Tú puedes!';
        setTimeout(resetItem, 1500);
    } else {
        document.getElementById('guide-label').textContent = '¡Casi! Intenta de nuevo ✨';
        setTimeout(() => {
            document.getElementById('guide-label').textContent = '¡Sigue el camino punteado!';
        }, 2000);
        if (LEVELS[state.level-1].guideAuto) startGuide();
        renderPath();
    }
}

function checkAchievements() {
    const ach = state.achievements;
    let newAch = null;
    
    if (state.completedLetters.length >= 1 && !ach.includes('primer_trazo')) {
        newAch = { id: 'primer_trazo', title: '✨ Primer trazo', desc: '¡Completaste tu primera letra!' };
    } else if (state.completedLetters.filter(l => l.length===1 && l>='A' && l<='Z' || l==='Ñ').length >= 27 && !ach.includes('abecedario')) {
        newAch = { id: 'abecedario', title: '🏆 Abecedario completo', desc: '¡Trazaste todas las letras!' };
    } else if (state.coins >= 50 && !ach.includes('coleccionista')) {
        newAch = { id: 'coleccionista', title: '💰 Coleccionista', desc: '¡Juntaste 50 monedas!' };
    } else if (state.coins >= 100 && !ach.includes('maestro')) {
        newAch = { id: 'maestro', title: '🌟 Maestro de letras', desc: '¡100 monedas! ¡Eres increíble!' };
    }
    
    if (newAch && !ach.includes(newAch.id)) {
        state.achievements.push(newAch.id);
        AudioFX.logro();
        document.getElementById('achievement-title').textContent = newAch.title;
        document.getElementById('achievement-desc').textContent = newAch.desc;
        setTimeout(() => document.getElementById('overlay-achievement').classList.add('show'), 800);
    }
}

function nextItem() {
    document.getElementById('overlay-success').classList.remove('show');
    
    const lvl = LEVELS[state.level - 1];
    state.currentItemIndex++;
    
    // Check if level complete
    if (state.currentItemIndex >= lvl.items.length) {
        state.currentItemIndex = 0;
        if (state.level < LEVELS.length) {
            state.level++;
            AudioFX.nivelCompleto();
            spawnConfetti(50);
            document.getElementById('guide-label').textContent = '🎉 ¡Nivel completado!';
        } else {
            // Game complete!
            document.getElementById('guide-label').textContent = '🏆 ¡Juego completado! ¡Eres un genio!';
        }
    }
    
    state.completedLetters = [];
    saveProgress();
    updateHUD();
    resetItem();
}

function resetItem() {
    stopGuide();
    state.wordLetterIndex = 0;
    traceState = {
        isDrawing: false, pathProgress: 0, guideActive: false,
        guideAnimId: null, userPoints: [], segmentsCovered: new Set(), totalSegments: 0
    };
    updateProgressBar();
    calculateRenderPath();
    renderPath();
    updateLetterDisplay();
    
    // Guide
    const lvl = LEVELS[state.level - 1];
    const guideBtn = document.getElementById('btn-guide');
    guideBtn.style.display = lvl.guideAuto ? 'none' : 'inline-block';
    
    if (lvl.guideAuto) {
        startGuide();
    }
    
    // Speak
    speakItem();
}

// ==========================================
//  TTS
// ==========================================
function speakItem() {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const item = getCurrentItem();
    const text = getItemType() === 'letters' ? item : item.word;
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'es-ES';
    msg.rate = 0.9;
    msg.pitch = 1.2;
    setTimeout(() => window.speechSynthesis.speak(msg), 300);
}

// ==========================================
//  UI UPDATES
// ==========================================
function updateLetterDisplay() {
    const display = document.getElementById('letter-display');
    const item = getCurrentItem();
    const isMinusculas = state.level === 3;
    
    if (getItemType() === 'letters') {
        // Niveles 1-2: MAYÚSCULAS. Nivel 3: minúsculas.
        const letter = isMinusculas ? item : item.toUpperCase();
        display.innerHTML = `<span style="font-family:Arial,sans-serif;font-weight:bold;font-size:56px;">${letter}</span>`;
    } else {
        // Palabras: resaltar letra actual
        const chars = item.word.split('').map((ch, i) => {
            const isCurrent = i === state.wordLetterIndex;
            const isDone = i < state.wordLetterIndex;
            const color = isCurrent ? '#EF476F' : isDone ? '#10b981' : '#d1d5db';
            return `<span style="color:${color};font-weight:${isCurrent?'900':'600'};">${ch}</span>`;
        }).join('');
        display.innerHTML = `<span style="font-family:Arial,sans-serif;font-weight:bold;font-size:36px;">${chars}</span> <span class="letter-emoji">${item.emoji}</span>`;
    }
    document.getElementById('guide-label').textContent = '¡Sigue el camino punteado!';
}

function updateHUD() {
    document.getElementById('level-badge').textContent = 'Nivel ' + state.level;
    document.getElementById('coins-display').textContent = '⭐ ' + state.coins;
    renderDebugLevels();
}

// Selector rapido de niveles (para QA)
function renderDebugLevels() {
    const container = document.getElementById('debug-levels');
    container.innerHTML = '';
    LEVELS.forEach(lvl => {
        const btn = document.createElement('button');
        btn.className = 'debug-lvl-btn' + (lvl.level === state.level ? ' active' : '') + (lvl.level === 3 ? ' minus' : '');
        btn.textContent = lvl.level === 3 ? 'N3 abc' : 'N' + lvl.level;
        btn.title = lvl.level === 3 ? 'Minusculas' : (lvl.level <= 2 ? 'Mayusculas' : 'Palabras');
        btn.addEventListener('click', () => jumpToLevel(lvl.level));
        container.appendChild(btn);
    });
}

function jumpToLevel(lvl) {
    stopGuide();
    if (traceState.reconnectTimer) clearTimeout(traceState.reconnectTimer);
    state.level = lvl;
    state.currentItemIndex = 0;
    state.wordLetterIndex = 0;
    state.completedLetters = [];
    state.failedAttempts = 0;
    saveProgress();
    updateHUD();
    resetItem();
}

function saveProgress() {
    UserSystem.saveProgress(GAME_ID, {
        level: state.level,
        coins: state.coins,
        completedLetters: state.completedLetters,
        achievements: state.achievements,
        failedAttempts: state.failedAttempts,
        currentItemIndex: state.currentItemIndex,
        wordLetterIndex: state.wordLetterIndex,
    });
}

// ==========================================
//  BUTTONS
// ==========================================
document.getElementById('btn-next').addEventListener('click', nextItem);
document.getElementById('btn-achievement-ok').addEventListener('click', () => {
    document.getElementById('overlay-achievement').classList.remove('show');
});
document.getElementById('btn-guide').addEventListener('click', showManualGuide);
document.getElementById('btn-reset').addEventListener('click', () => {
    document.getElementById('overlay-reset').classList.add('show');
});
document.getElementById('btn-reset-confirm').addEventListener('click', () => {
    state = {
        level: 1, coins: 0, completedLetters: [], achievements: [],
        failedAttempts: 0, currentItemIndex: 0, wordLetterIndex: 0
    };
    saveProgress();
    updateHUD();
    document.getElementById('overlay-reset').classList.remove('show');
    resetItem();
});
document.getElementById('btn-reset-cancel').addEventListener('click', () => {
    document.getElementById('overlay-reset').classList.remove('show');
});

// ==========================================
//  INIT
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
    // ☰ Dropdown menu
    const menuBtn = document.getElementById('menu-btn');
    const dropdownMenu = document.getElementById('dropdown-menu');
    menuBtn.addEventListener('click', (e) => {
        dropdownMenu.classList.toggle('show');
        menuBtn.classList.toggle('active');
        e.stopPropagation();
    });
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.dropdown')) {
            dropdownMenu.classList.remove('show');
            menuBtn.classList.remove('active');
        }
    });

    UserSystem.renderProfileBadge('profile-badge');
    MusicPlayer.init('music-btn');
    
    updateHUD();
    calculateRenderPath();
    renderPath();
    updateLetterDisplay();
    
    const lvl = LEVELS[state.level - 1];
    const guideBtn = document.getElementById('btn-guide');
    guideBtn.style.display = lvl.guideAuto ? 'none' : 'inline-block';
    
    if (lvl.guideAuto) startGuide();
    setTimeout(speakItem, 500);
});

// ==========================================
//  ANIMATION LOOP
// ==========================================
function gameLoop() {
    updateParticles();
    if (traceState.guideActive) {
        // Guide animation handled by interval in startGuide
    }
    renderPath();
    if (particles.length > 0) renderParticles();
    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
